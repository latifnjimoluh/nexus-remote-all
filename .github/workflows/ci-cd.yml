name: CI/CD Pipeline - Nexus Remote All

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: 🧪 Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🔍 Vérification TypeScript (Server & Client)
        run: npm run typecheck

      - name: 🏗️ Compilation de production
        run: npm run build

      - name: 🧪 Exécution des tests End-to-End
        run: xvfb-run --auto-servernum npm test

  deploy:
    name: 🚀 Déploiement VPS
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Installation & Build
        run: |
          npm ci
          npm run build

      - name: 🚀 Déploiement SSH sur le VPS (remote.unlineservice.com)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 51.68.191.239
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            if [ ! -d "/var/www/nexus-repo/.git" ]; then
              rm -rf /var/www/nexus-repo
              git clone https://github.com/latifnjimoluh/nexus-remote-all.git /var/www/nexus-repo
            fi
            cd /var/www/nexus-repo
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            # Synchroniser les fichiers web PWA vers la racine Nginx
            mkdir -p /var/www/nexus-remote/dist
            cp -r client/dist/* /var/www/nexus-remote/dist/
            # Redémarrer le service PM2 du relais Cloud
            pm2 restart nexus-relay || pm2 start relay/dist/index.js --name nexus-relay
            systemctl reload nginx
